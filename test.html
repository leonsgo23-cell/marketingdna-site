<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Marketing DNA</title>
<!--
  Страница тестового режима (22.09.2026). Александр: «достаточно всё сделать на
  сайте… ну и кто-то зайдёт на этот тест, ну и пусть зайдёт, мы же его не прячем.
  Кто захочет посмотреть, как будет выглядеть контент с его фотографиями — вот
  ссылка на сайт, и всё».

  Страница открыта: клиент заводится в момент отправки, по указанному контакту.
  Контакт обязателен — Александр 22.09: «зачем мы на сайте будем хранить информацию,
  придёт он или не придёт: в WhatsApp или Telegram ему выслали — у нас есть контакт,
  мы контролируем, что ему уходит». Готовый пакет сначала смотрит менеджер и только
  потом отправляет клиенту.
  Данные уходят на сервер бота, CORS там разрешён для наших доменов.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Цвета и шрифт — те же, что на основном сайте (ru.html): белый фон, фиолетовый
   акцент, Inter. Первая версия была тёмной «на свой вкус» — Александр поправил. */
:root{
  --purple:#7C3AED; --purple-light:#EDE9FE; --purple-dark:#5B21B6;
  --dark:#1E1B4B; --text:#374151; --muted:#6B7280;
  --gray:#F3F4F6; --border:#E5E7EB; --white:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:32px 18px 60px}
h1{font-size:26px;line-height:1.25;margin:0 0 10px;color:var(--dark);font-weight:800}
.lead{color:var(--muted);margin:0 0 28px}
.step{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--purple);margin:28px 0 10px}
textarea{width:100%;min-height:130px;background:var(--white);border:1px solid var(--border);border-radius:14px;color:var(--text);font:inherit;padding:14px;resize:vertical}
textarea:focus,.contact:focus{outline:2px solid var(--purple);outline-offset:1px;border-color:var(--purple)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.pick{display:block;width:100%;text-align:center;border:1px dashed var(--border);border-radius:14px;padding:18px;margin-top:12px;cursor:pointer;font-weight:600;color:var(--purple);background:var(--purple-light)}
.pick:active{background:#E0D9FD}
input[type=file]{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.thumbs img{width:100%;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.lang{flex:1;min-width:96px;background:var(--white);border:1px solid var(--border);border-radius:12px;color:var(--text);font:inherit;padding:12px;cursor:pointer}
.lang.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.contact{width:100%;background:var(--white);border:1px solid var(--border);border-radius:14px;color:var(--text);font:inherit;padding:14px}
.go{display:block;width:100%;background:var(--purple);color:#fff;border:0;border-radius:14px;padding:17px;font-size:16px;font-weight:700;margin-top:28px;cursor:pointer;font-family:inherit}
.go:active{background:var(--purple-dark)}
.go[disabled]{opacity:.55}
.msg{margin-top:14px;font-size:14px;min-height:20px;color:var(--purple-dark);word-break:break-word}
.ok{text-align:center;padding:48px 0}
.ok h2{font-size:23px;margin:0 0 10px;color:var(--dark)}
html,body{overflow-x:hidden}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
var API = 'https://marketingdna-bot-production.up.railway.app';
var MAX = 10, MIN_DESC = 30, photos = [];

var T = {
  ru: {
    title: 'Посмотрите, как будет выглядеть ваш контент',
    lead: 'Мы соберём для вас карусель, ролик, пост и сторис — на ваших собственных фотографиях. Это займёт около получаса.',
    step1: 'Шаг 1. Расскажите о бизнесе',
    ph1: 'Чем занимаетесь, что продаёте, где находитесь, кто ваши покупатели. Три-четыре предложения.',
    hint1: 'Чем конкретнее, тем точнее получатся тексты.',
    step2: 'Шаг 2. Фотографии вашего места',
    hint2: 'Витрина, зал, рабочее место, товар. От трёх до десяти снимков — обычных, с телефона.',
    hint2b: 'С фотографиями материалы будут сделаны в вашем помещении. Без них тоже получится — но обстановка будет общей.',
    pick: 'Выбрать фотографии',
    go: 'Собрать контент',
    sending: 'Отправляем…',
    okTitle: 'Готово, мы начали',
    okText: 'Материалы будут готовы примерно через 30 минут — пришлём их вам на указанный контакт.',
    tooShort: 'Напишите чуть подробнее — три-четыре предложения.',
    err: 'Не получилось отправить. Попробуйте ещё раз.',
    added: 'Добавлено фотографий: ',
    step3: 'Шаг 3. На каком языке делать контент',
    step4: 'Шаг 4. Куда прислать материалы',
    wa: 'В WhatsApp',
    tg: 'В Telegram',
    phPhone: 'Номер WhatsApp, например 371 20 000 000',
    hintWa: 'Пришлём материалы на этот номер.',
    hintTg: 'После кнопки откроется наш бот — нажмите в нём «Начать», и мы пришлём материалы туда.',
    needPhone: 'Укажите номер WhatsApp.',
    openTg: 'Открыть Telegram',
    tgWait: 'Остался один шаг: откройте бота и нажмите «Начать» — тогда мы начнём собирать и пришлём материалы вам.'
  },
  lv: {
    title: 'Paskatieties, kā izskatīsies jūsu saturs',
    lead: 'Sagatavosim jums karuseli, video, ierakstu un stories — ar jūsu pašu fotogrāfijām. Tas aizņems apmēram pusstundu.',
    step1: '1. solis. Pastāstiet par savu biznesu',
    ph1: 'Ar ko nodarbojaties, ko pārdodat, kur atrodaties, kas ir jūsu pircēji. Trīs četri teikumi.',
    hint1: 'Jo konkrētāk, jo precīzāki būs teksti.',
    step2: '2. solis. Jūsu vietas fotogrāfijas',
    hint2: 'Skatlogs, zāle, darba vieta, prece. No trim līdz desmit attēliem — parastiem, no telefona.',
    hint2b: 'Ar fotogrāfijām saturs tiks veidots tieši jūsu telpās. Bez tām arī sanāks — tikai vide būs vispārīga.',
    pick: 'Izvēlēties fotogrāfijas',
    go: 'Sagatavot saturu',
    sending: 'Sūtām…',
    okTitle: 'Gatavs, esam sākuši',
    okText: 'Materiāli būs gatavi apmēram pēc 30 minūtēm — atsūtīsim tos uz norādīto kontaktu.',
    tooShort: 'Uzrakstiet mazliet vairāk — trīs četrus teikumus.',
    err: 'Neizdevās nosūtīt. Mēģiniet vēlreiz.',
    added: 'Pievienotas fotogrāfijas: ',
    step3: '3. solis. Kādā valodā veidot saturu',
    step4: '4. solis. Kurp atsūtīt materiālus',
    wa: 'Uz WhatsApp',
    tg: 'Uz Telegram',
    phPhone: 'WhatsApp numurs, piemēram 371 20 000 000',
    hintWa: 'Atsūtīsim materiālus uz šo numuru.',
    hintTg: 'Pēc pogas atvērsies mūsu bots — nospiediet tajā «Sākt», un mēs atsūtīsim materiālus turp.',
    needPhone: 'Norādiet WhatsApp numuru.',
    openTg: 'Atvērt Telegram',
    tgWait: 'Palicis viens solis: atveriet botu un nospiediet «Sākt» — tad sāksim gatavot un atsūtīsim jums materiālus.'
  }
};

function q(name) {
  var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
// Язык: из адреса, иначе по языку браузера — страница открыта для всех
var LANG = q('l') === 'lv' ? 'lv' : (q('l') === 'ru' ? 'ru' : ((navigator.language || '').slice(0,2) === 'lv' ? 'lv' : 'ru'));
var t = T[LANG], KEY = '';
document.documentElement.lang = LANG;
function el(id) { return document.getElementById(id); }

{
  el('app').innerHTML =
    '<h1>' + t.title + '</h1><p class="lead">' + t.lead + '</p>' +
    '<div class="step">' + t.step1 + '</div>' +
    '<textarea id="d" placeholder="' + t.ph1 + '"></textarea>' +
    '<div class="hint">' + t.hint1 + '</div>' +
    '<div class="step">' + t.step2 + '</div>' +
    '<label class="pick" for="f">' + t.pick + '</label>' +
    '<input id="f" type="file" accept="image/*" multiple>' +
    '<div class="thumbs" id="th"></div>' +
    '<div class="hint">' + t.hint2 + '</div>' +
    '<div class="hint">' + t.hint2b + '</div>' +
    '<div class="step">' + t.step3 + '</div>' +
    '<div class="langs" id="lg">' +
      '<button type="button" class="lang" data-v="ru">Русский</button>' +
      '<button type="button" class="lang" data-v="lv">Latviešu</button>' +
      '<button type="button" class="lang" data-v="en">English</button>' +
    '</div>' +
    '<div class="step">' + t.step4 + '</div>' +
    '<div class="langs" id="ch">' +
      '<button type="button" class="lang on" data-ch="whatsapp">' + t.wa + '</button>' +
      '<button type="button" class="lang" data-ch="telegram">' + t.tg + '</button>' +
    '</div>' +
    '<input id="c" class="contact" style="margin-top:10px" placeholder="' + t.phPhone + '" inputmode="tel">' +
    '<div class="hint" id="ch_hint">' + t.hintWa + '</div>' +
    '<button class="go" id="go">' + t.go + '</button>' +
    '<div class="msg" id="m"></div>';

  // Снимок с телефона весит мегабайты — ужимаем прямо в браузере, иначе клиент
  // будет ждать загрузку, а сервер получать лишнее
  function shrink(file) {
    return new Promise(function (res) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1400 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }

  el('f').onchange = function (e) {
    var files = [].slice.call(e.target.files || []).slice(0, MAX - photos.length);
    var i = 0;
    (function next() {
      if (i >= files.length) { el('m').textContent = t.added + photos.length; return; }
      shrink(files[i++]).then(function (d) {
        if (d) {
          photos.push(d);
          var im = document.createElement('img'); im.src = d; el('th').appendChild(im);
        }
        next();
      });
    })();
  };

  // Язык контента выбирает клиент — это не то же самое, что язык страницы
  var CONTENT_LANG = LANG;
  [].forEach.call(document.querySelectorAll('.lang'), function (b) {
    if (b.getAttribute('data-v') === CONTENT_LANG) b.classList.add('on');
    b.onclick = function () {
      CONTENT_LANG = b.getAttribute('data-v');
      [].forEach.call(document.querySelectorAll('.lang'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
  });

  // Канал: WhatsApp — нужен номер; Telegram — номер не нужен, клиент подтвердит
  // переход нажатием кнопки в боте (так же, как вход с главной страницы сайта)
  var CHANNEL = 'whatsapp';
  [].forEach.call(document.querySelectorAll('[data-ch]'), function (b) {
    b.onclick = function () {
      CHANNEL = b.getAttribute('data-ch');
      [].forEach.call(document.querySelectorAll('[data-ch]'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      el('c').style.display = CHANNEL === 'whatsapp' ? '' : 'none';
      el('ch_hint').textContent = CHANNEL === 'whatsapp' ? t.hintWa : t.hintTg;
    };
  });

  el('go').onclick = function () {
    var d = el('d').value.trim();
    if (d.length < MIN_DESC) { el('m').textContent = t.tooShort; return; }
    var phone = el('c').value.trim();
    if (CHANNEL === 'whatsapp' && phone.replace(/\D/g, '').length < 8) {
      el('m').textContent = t.needPhone; el('c').focus(); return;
    }
    el('go').disabled = true; el('m').textContent = t.sending;

    fetch(API + '/test/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lang: CONTENT_LANG, channel: CHANNEL, phone: phone })
    }).then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.key) throw new Error('start');
        KEY = j.key;
        return sendPhotos();
      })
      .then(function () {
        return fetch(API + '/test/' + KEY + '/go', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description: d, photos: photos.length })
        });
      })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('go')); })
      .then(function (j) {
        if (j && j.telegram) {
          el('app').innerHTML = '<div class="ok"><h2>' + t.okTitle + '</h2><p class="lead">' + t.tgWait + '</p>' +
            '<a class="go" style="text-decoration:none;display:inline-block;width:auto;padding:16px 28px" href="' + j.telegram + '">' + t.openTg + '</a></div>';
        } else {
          el('app').innerHTML = '<div class="ok"><h2>' + t.okTitle + '</h2><p class="lead">' + t.okText + '</p></div>';
        }
      })
      .catch(function () { el('m').textContent = t.err; el('go').disabled = false; });
  };

  // Снимки идут по одному: так видно ход отправки и не упирается в размер запроса
  function sendPhotos() {
    var i = 0;
    return new Promise(function (done) {
      (function next() {
        if (i >= photos.length) return done();
        fetch(API + '/test/' + KEY + '/photo', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: photos[i] })
        }).then(function () {
          i++; el('m').textContent = t.sending + ' ' + i + '/' + photos.length; next();
        }).catch(function () { i++; next(); });
      })();
    });
  }
}
</script>
</body>
</html>
