<!-- Отказ от договора — функция «Atteikties no līguma» (правила КМ Латвии № 255, глава III1).
     Тексты утверждены Александром 26.09.2026. Заявка уходит в бот (/withdrawal), он
     отвечает квитанцией о получении: текст, дата и время. -->
<div class="header"><div class="header-inner"><a href="/" class="logo">Marketing <span>DNA</span></a></div></div>

<div class="container">
  <div class="lang-switch no-print">
    <button class="lang-btn" data-l="lv" type="button">LV</button>
    <button class="lang-btn" data-l="ru" type="button">RU</button>
  </div>

  <div id="formView">
    <h1 id="t_h"></h1>
    <p id="t_lead" style="margin-bottom:10px"></p>
    <form id="wForm" novalidate>
      <label class="f" for="w_name" id="t_name"></label><input class="in" id="w_name" autocomplete="name" required>
      <label class="f" for="w_contact" id="t_contact"></label><input class="in" id="w_contact" autocomplete="email" required>
      <label class="f" for="w_date" id="t_date"></label><input class="in" id="w_date">
      <label class="f" for="w_email" id="t_email"></label><input class="in" id="w_email" type="email" autocomplete="email">
      <label class="f" for="w_reason" id="t_reason"></label><textarea class="in" id="w_reason"></textarea>
      <input class="hp" id="w_site" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" id="w_go" type="submit" disabled></button>
      <div class="err" id="w_err" hidden></div>
    </form>
  </div>

  <div id="doneView" hidden>
    <h1 id="t_done"></h1>
    <div class="receipt" id="receipt"></div>
    <p id="t_mailed" hidden style="margin-top:12px"></p>
    <button class="btn no-print" id="w_save" type="button"></button>
  </div>
</div>

<div class="footer">Marketing DNA · <a href="/">marketing-dna.com</a> · © 2026</div>

<script>
var WITHDRAW_API = window.WITHDRAW_API || 'https://marketingdna-bot-production.up.railway.app/withdrawal';
var T = {
  ru: { h:'Отказ от договора', lead:'Если вы частное лицо, в течение 14 дней с заключения договора вы можете отказаться от него без объяснения причин. Заполните форму — это займёт минуту.',
        name:'Имя и фамилия', contact:'Email или телефон, которые вы указали при оплате', date:'Дата заказа (если помните)', email:'Куда прислать подтверждение (email)', reason:'Причина (необязательно)',
        go:'Подтвердить отказ', done:'Мы получили ваш отказ', save:'Сохранить подтверждение', mailed:'Мы отправили это подтверждение и на ваш email.',
        net:'Не удалось отправить. Проверьте интернет и попробуйте ещё раз.', badEmail:'Проверьте, правильно ли указан email.' },
  lv: { h:'Atteikšanās no līguma', lead:'Ja esat privātpersona, 14 dienu laikā no līguma noslēgšanas varat atteikties no līguma bez paskaidrojumiem. Aizpildiet formu — tas aizņems minūti.',
        name:'Vārds un uzvārds', contact:'E-pasts vai tālruņa numurs, ko norādījāt, apmaksājot pasūtījumu', date:'Pasūtījuma datums (ja atceraties)', email:'Kur atsūtīt apstiprinājumu (e-pasts)', reason:'Iemesls (nav obligāti)',
        go:'Apstiprināt atteikumu', done:'Jūsu atteikumu esam saņēmuši', save:'Saglabāt apstiprinājumu', mailed:'Šo apstiprinājumu nosūtījām arī uz jūsu e-pastu.',
        net:'Neizdevās nosūtīt. Pārbaudiet interneta savienojumu un mēģiniet vēlreiz.', badEmail:'Pārbaudiet, vai e-pasta adrese ir norādīta pareizi.' }
};
var LANG = ((location.search.match(/[?&]lang=(ru|lv)/) || [])[1]) || 'lv';
function $(id){ return document.getElementById(id); }
function apply(){
  var t = T[LANG]; document.documentElement.lang = LANG; document.title = t.h + ' — Marketing DNA';
  ['h','lead','name','contact','date','email','reason','done'].forEach(function(k){ $('t_'+k).textContent = t[k]; });
  $('w_go').textContent = t.go; $('w_save').textContent = t.save; $('t_mailed').textContent = t.mailed;
  document.querySelectorAll('.lang-btn').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-l') === LANG); });
}
document.querySelectorAll('.lang-btn').forEach(function(b){ b.onclick = function(){ LANG = b.getAttribute('data-l'); apply(); }; });
// «Подтвердить отказ» активна, когда заполнены имя и контакт — без сообщений об ошибке
function check(){ $('w_go').disabled = $('w_name').value.trim().length < 2 || $('w_contact').value.trim().length < 4; }
['w_name','w_contact'].forEach(function(id){ $(id).addEventListener('input', check); });
$('wForm').onsubmit = function(e){
  e.preventDefault(); if ($('w_go').disabled) return;
  var em = $('w_email').value.trim();
  if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { $('w_err').textContent = T[LANG].badEmail; $('w_err').hidden = false; return; }
  $('w_err').hidden = true; $('w_go').disabled = true;
  fetch(WITHDRAW_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    lang: LANG, name: $('w_name').value, contact: $('w_contact').value, orderDate: $('w_date').value,
    receiptEmail: em, reason: $('w_reason').value, website: $('w_site').value }) })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (!j || !j.ok || !j.receipt) throw new Error('bad');
    var box = $('receipt'); box.innerHTML = '';
    var h = document.createElement('h3'); h.textContent = j.receipt.title; box.appendChild(h);
    j.receipt.lines.forEach(function(l){ var p = document.createElement('p'); p.textContent = l; box.appendChild(p); });
    $('t_mailed').hidden = !j.sentEmail;
    $('formView').hidden = true; $('doneView').hidden = false; window.scrollTo(0, 0);
  })
  .catch(function(){ $('w_err').textContent = T[LANG].net; $('w_err').hidden = false; check(); });
};
// «Сохранить подтверждение» — печать или сохранение в PDF средствами браузера/телефона
$('w_save').onclick = function(){ window.print(); };
apply(); check();
</script>
</body>
